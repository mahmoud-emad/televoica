version: '3.8'

services:
  televoica-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: televoica-bot
    restart: unless-stopped
    
    environment:
      # Bot configuration
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      STT_TELEGRAM_BOT: "true"
      
      # STT Provider settings
      STT_PROVIDER: ${STT_PROVIDER:-faster_whisper}
      STT_WHISPER_MODEL: ${STT_WHISPER_MODEL:-large-v3}
      STT_WHISPER_DEVICE: ${STT_WHISPER_DEVICE:-auto}
      STT_WHISPER_COMPUTE_TYPE: ${STT_WHISPER_COMPUTE_TYPE:-auto}
      STT_WHISPER_LANGUAGE: ${STT_WHISPER_LANGUAGE:-}
      STT_WHISPER_INITIAL_PROMPT: ${STT_WHISPER_INITIAL_PROMPT:-}
      STT_WHISPER_BEAM_SIZE: ${STT_WHISPER_BEAM_SIZE:-5}
      STT_WHISPER_VAD_FILTER: ${STT_WHISPER_VAD_FILTER:-true}
      
      # Telegram settings
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_MAX_FILE_SIZE_MB: ${TELEGRAM_MAX_FILE_SIZE_MB:-20}
      
      # Release announcements
      STT_DATA_DIR: /data
      STT_ANNOUNCE_RELEASES: ${STT_ANNOUNCE_RELEASES:-true}

      # Logging
      STT_LOG_LEVEL: ${STT_LOG_LEVEL:-INFO}
    
    volumes:
      # Persist temporary files
      - televoica-temp:/tmp/televoica
      # Cache downloaded models (large-v3 is ~3 GB) across restarts
      - televoica-models:/home/botuser/.cache
      # Known chats + last announced release (must persist across updates)
      - televoica-data:/data
      # Optional: Mount logs directory (comment out if you get permission errors)
      # - ./logs:/app/logs
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  televoica-temp:
    driver: local
  televoica-models:
    driver: local
  televoica-data:
    driver: local

