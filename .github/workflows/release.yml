name: Release

# Publishes the full release notes as a GitHub Release when a new version lands.
# The short chat announcement is sent by the bot itself, once, the first time it
# starts on that version (see televoica/bot/announcements.py), so it works on
# whatever host runs the bot.

on:
  push:
    branches: [ master, development ]
    paths:
      - 'pyproject.toml'
      - 'release_notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read version
      id: version
      run: |
        VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Require release notes
      run: |
        test -f "release_notes/${{ steps.version.outputs.version }}.md" || {
          echo "::error::release_notes/${{ steps.version.outputs.version }}.md is missing. Add release notes for every version bump."
          exit 1
        }

    - name: Create release if new
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "Release v$VERSION already exists; nothing to do"
        else
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "release_notes/$VERSION.md"
        fi
